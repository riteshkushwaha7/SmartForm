<!doctype html><html><head><title>SmartForm demo application</title><style>body{font-family:Arial;max-width:700px;margin:40px auto}label{display:block;margin:14px 0}input,textarea{display:block;width:100%;padding:9px;margin-top:5px}textarea{height:110px}</style></head><body><h1>Software Engineering Internship</h1><p>We are looking for candidates with full-stack and problem-solving experience.</p><form><label>Given Name<input name="given_name"></label><label>Family Name<input name="surname"></label><label>Email Address<input type="email" name="email_address"></label><label>Mobile Number<input type="tel" placeholder="Contact number"></label><label>University / Institution<input name="college"></label><label>Current CGPA<input type="number" step="0.01"></label><label>Describe a project relevant to this position<textarea name="project_experience"></textarea></label><label>Aadhaar Number <input name="aadhaar"></label><button type="submit">Submit application</button></form><p><small>This ordinary submit button intentionally has no SmartForm integration; submission stays yours.</small></p></body></html>
